apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: haproxy
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: haproxy
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: haproxy
    spec:
      automountServiceAccountToken: false
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet # or Default
      priorityClassName: system-node-critical
      tolerations:
        - operator: Exists
      initContainers:
        - name: netsetup
          image: hegerdes/debug:ip-tools-alpine # alpine with iproute2
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              SENTINEL=192.0.2.10

              # Loopback is unconditionally excluded from Cilium device auto-detection,
              # so the sentinel cannot be picked up as a NodePort address.
              if ! ip -4 addr show dev lo | grep -qw "$SENTINEL"; then
                ip addr add "${SENTINEL}/32" dev lo
              fi

              # Remove a stale copy left by an earlier dummy-interface setup.
              if ip link show k8sapi >/dev/null 2>&1; then
                ip addr del "${SENTINEL}/32" dev k8sapi 2>/dev/null || true
              fi

              ip -4 addr show dev lo | grep -w "$SENTINEL"
      containers:
        - name: haproxy
          image: haproxy:3.4
          args:
            - "-f"
            - "/var/run/haproxy/haproxy.cfg"
            - "-db"
          ports:
            - name: tcp-6443
              containerPort: 6443
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /var/run/haproxy
          securityContext:
            runAsNonRoot: true
            runAsUser: 99
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          projected:
            sources:
              - secret:
                  name: kube-downstream-api-proxy-tls
                  items:
                    - key: tls-combined.pem
                      path: tls-combined.pem
              - configMap:
                  name: kube-api-proxy-config
                  items:
                    - key: haproxy.cfg
                      path: haproxy.cfg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kube-api-proxy-config
  namespace: kube-system
data:
  haproxy.cfg: |
    global
      log stdout format raw local0 info
      maxconn 2000

    defaults
      log global
      mode tcp
      option tcplog
      timeout connect 5s
      timeout check   5s
      timeout client  3m
      timeout server  3m
      timeout tunnel  12h

    frontend kube_apiserver
      bind 192.0.2.10:6443 ssl crt /var/run/haproxy/tls-combined.pem
      tcp-request inspect-delay 5s
      default_backend apiserver_upstream

    backend apiserver_upstream
      mode tcp
      server upstream test1.hks.eu-central.hegerdes.com:6443 ssl verify none sni str(test1.hks.eu-central.hegerdes.com)
---
apiVersion: v1
kind: Service
metadata:
  name: haproxy-kubernetes
  namespace: kube-system
spec:
  selector:
    app: haproxy
  ports:
    - name: tcp-6443
      port: 6443
      targetPort: 6443
      protocol: TCP
  type: ClusterIP
